<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brückenkrieg</title>
</head>
<body>

<style>
/* ============================================================
   BRÜCKENKRIEG — Stile
   Ein bewusst einzelnes, dunkles Theme: Spielbildschirm, kein Dokument.
   ============================================================ */
:root{
  --ground:#0E1A18;
  --panel:#152321;
  --panel-hi:#1D2F2C;
  --line:#26403C;
  --blue:#4C7DFF;
  --blue-soft:#2B4694;
  --red:#FF5A3C;
  --red-soft:#8C3323;
  --elixir:#B15CFF;
  --elixir-dim:#4A2A66;
  --text:#E6EFEC;
  --muted:#8FA39D;
  --gold:#F0C14B;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --font-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--ground);
  color:var(--text);
  font-family:var(--font-ui);
  overflow:hidden;
  /* Vom Homebildschirm gestartet gibt es keine Adressleiste, die das
     Wegziehen abfaengt: ohne das hier laesst sich das ganze Spielfeld
     mit dem Finger verschieben. */
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

#app{
  height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  /* Im Vollbild liegt der Inhalt sonst unter Notch und Home-Balken.
     env(safe-area-inset-*) ist ausserhalb davon schlicht 0. */
  padding:calc(8px + env(safe-area-inset-top))
          calc(8px + env(safe-area-inset-right))
          calc(8px + env(safe-area-inset-bottom))
          calc(8px + env(safe-area-inset-left));
}

/* ---------- Statusleiste ---------- */
#status{
  width:100%;
  max-width:520px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:6px 12px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  flex:0 0 auto;
}
.crowns{display:flex;align-items:center;gap:6px;font-family:var(--font-num);font-size:15px;font-variant-numeric:tabular-nums;}
.crowns b{font-size:19px;font-weight:700;}
.crowns.red b{color:var(--red);}
.crowns.blue b{color:var(--blue);}
.crowns span{color:var(--muted);font-family:var(--font-ui);font-size:10px;letter-spacing:.09em;text-transform:uppercase;}
#clock{text-align:center;line-height:1.15;}
#time{font-family:var(--font-num);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;}
#phase{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
#phase.hot{color:var(--gold);}

/* ---------- Arena ---------- */
#stage{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  justify-content:center;
  width:100%;
}
canvas{
  width:100%;
  height:100%;
  border-radius:12px;
  border:1px solid var(--line);
  display:block;
  touch-action:manipulation;
}

/* ---------- Dock ---------- */
#dock{
  width:100%;
  max-width:520px;
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  gap:7px;
}
#elixirRow{display:flex;align-items:center;gap:9px;}
#elixirBar{
  position:relative;
  flex:1;
  height:16px;
  background:var(--elixir-dim);
  border-radius:8px;
  overflow:hidden;
  border:1px solid #33204a;
}
#elixirFill{
  height:100%;
  width:0%;
  background:linear-gradient(180deg,#CD86FF,var(--elixir));
  transition:width .07s linear;
}
#elixirTicks{position:absolute;inset:0;display:flex;}
#elixirTicks i{flex:1;border-right:1px solid rgba(14,26,24,.55);}
#elixirTicks i:last-child{border-right:0;}
#elixirNum{
  font-family:var(--font-num);font-size:17px;font-weight:700;
  color:#D9AEFF;min-width:2.1ch;text-align:right;font-variant-numeric:tabular-nums;
}

/* Die Handkarten sind echte Kartenbilder: Rahmen, Titel und Figur
   stecken im Bild selbst. Die Karte ist damit nur noch ein Rahmen
   mit fester Seitenlaenge, das Bild fuellt ihn per object-fit aus.
   Karten ohne eigenes Bild bekommen denselben Goldrahmen in CSS
   nachgebaut, damit die Reihe als ein Set liest. Die Goldtoene sind
   direkt aus dem Rahmen der gezeichneten Karten abgegriffen.        */
#hand{display:grid;grid-template-columns:.62fr repeat(4,1fr);gap:6px;align-items:end;}
.card{
  position:relative;
  aspect-ratio:224/311;
  max-height:min(150px,21dvh);
  border:0;padding:0;
  border-radius:8px;
  overflow:hidden;
  background:#12201E;
  cursor:pointer;
  transition:transform .1s ease;
  font:inherit;color:inherit;display:block;
}
.card .ico{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-emoji);font-size:30px;line-height:1;
}
.card .ico img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}

/* Platzhalter: Goldrahmen ueber zwei Hintergruende (padding-box/border-box),
   Titelschild oben wie bei den gezeichneten Karten. */
.card:not(.has-art){
  background:linear-gradient(#1E3033,#16262A) padding-box,
             linear-gradient(160deg,#F0D48A,#C7A452 38%,#8A6228 72%,#5E4118) border-box;
  border:2px solid transparent;
}
.card:not(.has-art):not(.next) .ico{
  inset:21px 3px 3px;
  border-radius:4px;
  background:radial-gradient(62% 55% at 50% 42%,#2A4247,#16262A 78%);
}
.card:not(.has-art) .nm{
  position:absolute;left:2px;right:2px;top:2px;height:17px;z-index:2;
  display:flex;align-items:center;justify-content:center;
  padding:0 2px;
  background:linear-gradient(#B98F3E,#7C5620);
  border:1px solid #E0BF74;border-radius:3px;
  /* Mitwachsend: "Straßenbande" ist der laengste Name und passt bei
     festen 7px auf einem 390 Punkte breiten Telefon nicht mehr aufs
     Schild. Nach oben gedeckelt, sonst wird es auf dem Rechner gross. */
  font-size:clamp(5.4px,1.45vw,7px);
  font-weight:800;letter-spacing:.02em;text-transform:uppercase;
  color:#FFF7E3;text-shadow:0 1px 1px rgba(0,0,0,.55);
  overflow:hidden;white-space:nowrap;
}
.card.has-art .nm{display:none;}

/* Unten links, nicht oben: der Kartenname steht bei diesen Bildern
   im Titelband ganz oben, dort wuerde die Kugel ihn verdecken. */
.card .cost{
  position:absolute;bottom:4px;left:4px;z-index:3;
  min-width:19px;height:19px;padding:0 4px;
  background:radial-gradient(circle at 35% 30%,#D89BFF,var(--elixir));
  border:1.5px solid rgba(8,16,15,.85);
  box-shadow:0 1px 3px rgba(0,0,0,.6);
  border-radius:50%;
  font-family:var(--font-num);font-size:11px;font-weight:700;color:#fff;
  text-shadow:0 1px 1px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
}

.card:hover:not(:disabled){transform:translateY(-2px);}
.card.sel{transform:translateY(-6px);}
.card.sel::after{
  content:"";position:absolute;inset:0;border-radius:8px;z-index:4;
  box-shadow:inset 0 0 0 2px var(--blue),0 0 16px -2px var(--blue);
  pointer-events:none;
}
/* Zu wenig Elixier: abdunkeln statt ausblenden, die Karte bleibt lesbar. */
.card:disabled{cursor:default;}
.card:disabled::before{
  content:"";position:absolute;inset:0;z-index:2;border-radius:8px;
  background:rgba(8,14,20,.55);
}
.card:disabled .ico img{filter:grayscale(.5) brightness(.85);}
.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

.card.next{cursor:default;opacity:.62;}
.card.next .ico{font-size:20px;}
.card.next .lbl{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding:4px 0 3px;
  background:linear-gradient(rgba(8,15,14,0),rgba(8,15,14,.93) 55%);
  font-size:7px;letter-spacing:.14em;text-transform:uppercase;
  color:#C6D4D0;text-align:center;
  text-shadow:0 1px 2px rgba(0,0,0,.9);
}
@media (prefers-reduced-motion:reduce){
  .card{transition:none;}
}

/* ---------- Overlays ---------- */
.veil{
  position:absolute;inset:0;
  background:rgba(6,14,13,.9);
  backdrop-filter:blur(3px);
  border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:22px;text-align:center;z-index:5;
}
.veil[hidden]{display:none;}
.veil h1{margin:0;font-size:26px;letter-spacing:.02em;font-weight:800;}
.veil h2{margin:0;font-size:23px;font-weight:800;letter-spacing:.02em;}
.veil p{margin:0;max-width:34ch;font-size:12.5px;line-height:1.6;color:var(--muted);}
.veil .sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.btn{
  font:inherit;font-size:13px;font-weight:650;letter-spacing:.03em;
  padding:10px 22px;border-radius:9px;cursor:pointer;
  background:var(--blue);color:#fff;border:0;
}
.btn:hover{filter:brightness(1.12);}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.diff{display:flex;gap:6px;}
.diff button{
  font:inherit;font-size:11.5px;padding:7px 14px;border-radius:8px;cursor:pointer;
  background:var(--panel);color:var(--muted);border:1px solid var(--line);
}
.diff button.on{background:var(--panel-hi);color:var(--text);border-color:var(--blue);}
.diff button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.tally{font-family:var(--font-num);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;}

#hint{
  position:absolute;left:0;right:0;bottom:9px;text-align:center;
  font-size:10.5px;letter-spacing:.05em;color:var(--muted);
  pointer-events:none;text-shadow:0 1px 4px #000;
}
#hint[hidden]{display:none;}

@media (max-height:640px){
  .card .nm{display:none;}
  #status{padding:4px 10px;}
}
@media (prefers-reduced-motion:reduce){
  .card{transition:none;}
  #elixirFill{transition:none;}
}
</style>

<div id="app">

  <div id="status">
    <div class="crowns red"><span>Gegner</span><b id="crRed">0</b></div>
    <div id="clock"><div id="time">3:00</div><div id="phase">Reguläre Zeit</div></div>
    <div class="crowns blue"><b id="crBlue">0</b><span>Du</span></div>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint" hidden></div>

    <div class="veil" id="startVeil">
      <div>
        <div class="sub">Ein Kartenspiel um zwei Brücken</div>
        <h1>Brückenkrieg</h1>
      </div>
      <p>Karte antippen, dann auf deine Hälfte tippen. Zerstöre mehr Türme als der Gegner —
         oder seinen Königsturm, dann ist sofort Schluss.</p>
      <div class="diff" id="diffPick">
        <button data-d="0">Leicht</button>
        <button data-d="1" class="on">Normal</button>
        <button data-d="2">Schwer</button>
      </div>
      <button class="btn" id="startBtn">Kampf beginnen</button>
    </div>

    <div class="veil" id="endVeil" hidden>
      <h2 id="endTitle">—</h2>
      <div class="tally" id="endTally">—</div>
      <p id="endWhy">—</p>
      <button class="btn" id="againBtn">Nochmal</button>
    </div>
  </div>

  <div id="dock">
    <div id="elixirRow">
      <div id="elixirBar">
        <div id="elixirFill"></div>
        <div id="elixirTicks"></div>
      </div>
      <div id="elixirNum">0</div>
    </div>
    <div id="hand"></div>
  </div>

</div>

<script src="vendor/three.min.js"></script>
<script src="textures.js"></script>
<script src="models.js"></script>
<script src="render3d.js"></script>

<script>
"use strict";
/* ============================================================
   BRÜCKENKRIEG
   Ein Arena-Kartenspiel. Alles in einer Datei, kein Build nötig.

   Aufbau der Datei:
     1  KARTEN        — alle Spielwerte, hier änderst du das Spiel
     2  ARENA         — Maße, Fluss, Brücken, Türme
     3  WELT          — Zustand und Aufbau einer Partie
     4  WEGFINDUNG    — wie Einheiten laufen
     5  ZIELE & KAMPF — wen greift wer an
     6  ZAUBER
     7  GEGNER-KI
     8  SPIELSCHLEIFE — Tick, Elixier, Uhr, Sieg
     9  DARSTELLUNG   — Canvas
    10  BEDIENUNG     — Hand, Klicks, Overlays
   ============================================================ */

/* ============================================================
   1 · KARTEN
   Tempo: langsam 0.7 · mittel 1.0 · schnell 1.4 · sehr schnell 1.8 (Kacheln/s)
   targets: 'ground' | 'air' | 'both' | 'buildings'
   Faustregel: 1 Elixier ≈ 380 effektive HP  ODER  ≈ 60 DPS.
   ============================================================ */
const CARDS = {
  /* --- Eigene Charaktere --------------------------------------------
     Abdu · Nahkämpfer · Fraktion Eisenband
     Schwerer Plattenpanzer mit Fellmantel, doppelköpfige Axt.
     Eingeordnet zwischen Klingenwache (3💧) und Steinwächter (5💧):
     mehr Schaden als der Steinwächter, weit weniger Lebenspunkte.
     Trifft keine Luftziele — die Axt reicht nicht nach oben.        */
  abdu:{ name:"Abdu", emoji:"🪓", card:"assets/cards/abdu.jpg",
    cost:4, kind:"troop", count:1,
    hp:2000, damage:230, hitSpeed:1.3, range:1.2, speed:1.0,
    layer:"ground", targets:"ground", radius:0.48 },

  /* Yunus Peace · Fernkämpfer · Bogen
     Füllt die Lücke im Roster: bis hierhin gab es nichts, was
     Luftziele trifft. Beweglich und weitreichend, dafür wenig
     Lebenspunkte — ein Sportler, kein Gepanzerter.
     Reichweite bewusst bei 5.8 und nicht höher: mit 6.5 überschoss
     er jede Karte im Gegnerdeck und drehte die Schwierigkeitskurve
     um — gegen "Schwer" gewann man dann am leichtesten.
     Wappen und Fluggesellschafts-Logo der Vorlage sind bewusst
     nicht nachgebaut.                                            */
  yunus:{ name:"Yunus Peace", emoji:"🏹", card:"assets/cards/yunus.jpg",
    cost:4, kind:"troop", count:1,
    hp:520, damage:200, hitSpeed:1.15, range:5.8, speed:1.2,
    layer:"ground", targets:"both", radius:0.42 },

  /* Mertabi · Zauberer · Kristallstab
     Schließt die zweite große Lücke: Flächenschaden. Große
     Explosion, dafür langsame Schlagfolge und kurze Reichweite —
     er trifft selten, dann aber alles auf einmal.
     Die Spiellogo-Einblendungen der Vorlage sind nicht nachgebaut. */
  mertabi:{ name:"Mertabi", emoji:"🔮", card:"assets/cards/mertabi.jpg",
    cost:4, kind:"troop", count:1,
    hp:640, damage:300, hitSpeed:1.9, range:5.2, speed:0.9,
    layer:"ground", targets:"both", splash:1.6, radius:0.45 },

  /* Timgioh · Riese · Tank
     Reiner Schadensschwamm: mehr Lebenspunkte als alles bisherige,
     dafür der langsamste im Spiel und mit der trägsten Schlagfolge.
     Er schlägt mit den Fäusten — keine Reichweite nach oben, also
     kein Treffer gegen Luftziele.                                  */
  timgioh:{ name:"Timgioh", emoji:"🪵", card:"assets/cards/timgioh.jpg",
    cost:5, kind:"troop", count:1,
    hp:3800, damage:240, hitSpeed:1.8, range:1.3, speed:0.65,
    layer:"ground", targets:"ground", radius:0.62 },

  /* Azizis · Schwarm · fünf Schwertkämpfer mit Schild
     Schließt die letzte Roster-Lücke: einen Schwarm aus mehreren
     eigenen Einheiten auf einer Karte. Schwärme sind stark gegen
     einzelne dicke Ziele (fünf Klingen zerlegen einen Tank), zahlen
     das aber teuer:
       · Flächenschaden (Mertabi, Feuermagier, Feuerball, Splitterregen)
         trifft alle fünf auf einmal und löscht die Karte fast umsonst
       · nur Boden — gegen Luft völlig wehrlos
       · Nahkampf — Fernkämpfer treten sie aus der Distanz aus
     Das Schild macht sie pro Kopf zäher als die Straßenbande (Messer,
     kein Schild): 240 statt 220 HP, dafür kosten sie mehr.
     Gesamt-DPS bewusst hoch (fünf mal 84), Gesamt-HP moderat — sie
     leben von der Menge, nicht vom einzelnen Körper.                 */
  azizis:{ name:"Azizis", emoji:"⚔️", card:"assets/cards/azizis.jpg",
    cost:4, kind:"troop", count:5,
    hp:240, damage:92, hitSpeed:1.1, range:1.2, speed:1.4,
    layer:"ground", targets:"ground", radius:0.30 },

  /* Abu Goku · Drache · fliegender Feuerball-Werfer
     Schließt die letzte Rollen-Lücke: eine eigene Lufteinheit. Ein
     fliegender Fernkämpfer mit Flächenschaden — im Grunde ein Feuermagier
     in der Luft. Fliegen ist ein starker Vorteil: nur Karten, die Luft
     treffen, kommen überhaupt an ihn heran. Bezahlt wird das mit wenig
     Panzerung — 720 HP, weniger als der Sturmfalke (900). Jede Luftabwehr
     (Yunus, Bogenschützinnen, Fledermäuse, Sturmfalke, Feuermagier)
     holt ihn schnell herunter.
     Zur Abgrenzung vom Sturmfalken: der ist ein zäher Kurzstrecken-Stürzer
     (Reichweite 2.5), Abu Goku der zerbrechliche Weitwurf-Werfer
     (Reichweite 4.2, größerer Splash). "Feuerball" heißt hier
     Flächenschaden — ein sichtbares Geschoss gibt es wie bei allen
     Fernkämpfern nicht.                                               */
  abugoku:{ name:"Abu Goku", emoji:"🐉", card:"assets/cards/abugoku.jpg",
    cost:4, kind:"troop", count:1,
    hp:720, damage:160, hitSpeed:1.6, range:4.2, speed:1.0,
    layer:"air", targets:"both", splash:1.5, radius:0.5 },

  /* --- Nahkampf & Tanks --- */
  steinwaechter:{ name:"Steinwächter", emoji:"🗿", cost:5, kind:"troop", count:1,
    hp:3200, damage:220, hitSpeed:1.5, range:1.2, speed:0.7, layer:"ground", targets:"ground", radius:0.55 },
  klingenwache:{ name:"Klingenwache", emoji:"🗡️", cost:3, kind:"troop", count:1,
    hp:1400, damage:160, hitSpeed:1.2, range:1.2, speed:1.0, layer:"ground", targets:"ground", radius:0.42 },
  rammbock:{ name:"Rammbock", emoji:"🐗", cost:4, kind:"troop", count:1,
    hp:1900, damage:300, hitSpeed:1.5, range:1.2, speed:1.4, layer:"ground", targets:"buildings", radius:0.5 },

  /* --- Schwarm --- */
  rattenrudel:{ name:"Rattenrudel", emoji:"🐀", cost:1, kind:"troop", count:4,
    hp:90, damage:60, hitSpeed:0.9, range:1.2, speed:1.8, layer:"ground", targets:"ground", radius:0.26 },
  strassenbande:{ name:"Straßenbande", emoji:"🔪", cost:2, kind:"troop", count:3,
    hp:220, damage:105, hitSpeed:1.1, range:1.2, speed:1.4, layer:"ground", targets:"ground", radius:0.31 },
  speerbrueder:{ name:"Speerbrüder", emoji:"🪃", cost:2, kind:"troop", count:3,
    hp:130, damage:60, hitSpeed:1.1, range:5.0, speed:1.0, layer:"ground", targets:"both", radius:0.29 },

  /* --- Fernkampf --- */
  bogenschuetzinnen:{ name:"Bogenschützinnen", emoji:"🏹", cost:3, kind:"troop", count:2,
    hp:300, damage:95, hitSpeed:1.2, range:5.5, speed:1.0, layer:"ground", targets:"both", radius:0.33 },
  feuermagier:{ name:"Feuermagier", emoji:"🔥", cost:4, kind:"troop", count:1,
    hp:620, damage:250, hitSpeed:1.6, range:5.5, speed:1.0, layer:"ground", targets:"both", splash:1.3, radius:0.42 },
  fernrohrschuetzin:{ name:"Fernrohrschützin", emoji:"🔭", cost:4, kind:"troop", count:1,
    hp:420, damage:400, hitSpeed:2.4, range:9.0, speed:0.7, layer:"ground", targets:"both", radius:0.4 },

  /* --- Luft --- */
  sturmfalke:{ name:"Sturmfalke", emoji:"🦅", cost:4, kind:"troop", count:1,
    hp:900, damage:140, hitSpeed:1.4, range:2.5, speed:1.0, layer:"air", targets:"both", splash:1.2, radius:0.48 },
  fledermausschwarm:{ name:"Fledermäuse", emoji:"🦇", cost:2, kind:"troop", count:5,
    hp:70, damage:55, hitSpeed:0.9, range:1.2, speed:1.8, layer:"air", targets:"both", radius:0.25 },
  glockenballon:{ name:"Glockenballon", emoji:"🎈", cost:5, kind:"troop", count:1,
    hp:1700, damage:700, hitSpeed:3.0, range:1.5, speed:0.7, layer:"air", targets:"buildings", radius:0.5,
    deathBlast:{ damage:300, radius:2.0 } },

  /* --- Zauber (Türme nehmen nur 35 %) --- */
  splitterregen:{ name:"Splitterregen", emoji:"🌧️", cost:3, kind:"spell", radius:3.5, damage:250 },
  feuerball:{ name:"Feuerball", emoji:"☄️", cost:4, kind:"spell", radius:2.5, damage:600, knockback:1.3 },
  blitzschlag:{ name:"Blitzschlag", emoji:"⚡", cost:5, kind:"spell", radius:1.8, damage:900 },
  frostwelle:{ name:"Frostwelle", emoji:"❄️", cost:2, kind:"spell", radius:3.0, damage:80, freeze:2.5 },

  /* --- Gebäude --- */
  speerturm:{ name:"Speerturm", emoji:"🏯", cost:4, kind:"building", count:1,
    hp:1050, damage:110, hitSpeed:0.9, range:6.5, speed:0, layer:"ground", targets:"both", lifetime:35, radius:0.72 },
  bollwerk:{ name:"Bollwerk", emoji:"🧱", cost:3, kind:"building", count:1,
    hp:2200, damage:0, hitSpeed:1, range:0, speed:0, layer:"ground", targets:"ground", lifetime:30, radius:0.8 },
};

const TOWER_STATS = {
  crown:{ name:"Wachturm",    emoji:"🏰", hp:2400, damage:90,  hitSpeed:0.8, range:7.5, radius:1.05 },
  king: { name:"Königsturm",  emoji:"👑", hp:4000, damage:110, hitSpeed:1.0, range:7.0, radius:1.25 },
};

// Alle sechs eigenen Charaktere stehen in beiden Decks (Abdu, Yunus,
// Mertabi, Timgioh, Azizis, Abu Goku) — Abu Goku nimmt den Luft-Platz
// ein, beim Spieler statt der Fledermaeuse, beim Gegner statt des
// Sturmfalken. Bleiben je zwei Fueller-Plaetze.
const DECK_BLUE = ["abdu","yunus","mertabi","timgioh",
                   "azizis","abugoku","feuerball","speerturm"];
// Der Gegner spielt dieselben eigenen Charaktere wie du — sonst waeren
// sie nur Deko im Spielerdeck. Die uebrigen zwei Plaetze sind bewusst
// anders besetzt als in DECK_BLUE, damit sich die Partien unterscheiden:
// Rammbock als Siegbedingung, Splitterregen als Zauber.
const DECK_RED  = ["abdu","yunus","mertabi","timgioh",
                   "azizis","abugoku","rammbock","splitterregen"];

/* interval  = Sekunden zwischen zwei Entscheidungen (Reaktionszeit)
   savings   = ab wie viel Elixier die KI zum Angriff übergeht.
               Hoch = große, gebündelte Wellen = stark.
               Niedrig = ständig kleine Häppchen, die einzeln abgewehrt werden.
   sloppiness= Rauschen bei der Kartenwahl
   skip      = Chance, eine Verteidigung schlicht zu verschlafen
   aim       = Streuung der Platzierung in Kacheln (Anfängerfehler)
   combo     = Chance, hinter einen Angreifer sofort Unterstützung
               nachzulegen, statt Karten einzeln zu verheizen
   patience  = Kampfwert, den eine Bedrohung erreichen muss, bevor
               überhaupt verteidigt wird. Kleinkram fangen die Türme
               selbst ab — wer auf jede Ratte eine Karte wirft, steht
               beim echten Angriff mit leeren Händen da. Gelassenheit
               ist hier also Können, nicht Trägheit.                    */
const DIFFICULTY = [
  { name:"Leicht", interval:2.6, savings:6, sloppiness:0.9, skip:0.50, aim:3.5, combo:0.0,  patience:0    },
  { name:"Normal", interval:1.0, savings:6, sloppiness:0.2, skip:0.10, aim:1.2, combo:0.45, patience:600  },
  { name:"Schwer", interval:0.4, savings:6, sloppiness:0.0, skip:0.0,  aim:0.0, combo:1.0,  patience:1000 },
];

/* ============================================================
   2 · ARENA
   18 Kacheln breit, 32 hoch. Du bist unten (Team "blue"),
   die KI oben (Team "red"). Der Fluss liegt quer in der Mitte,
   überquerbar nur auf zwei Brücken.
   ============================================================ */
const AW = 18, AH = 32;
const RIVER = { y0:15, y1:17 };
const BRIDGES = [3.5, 14.5];
const BRIDGE_HALF = 1.0;

const TOWER_SPOTS = [
  { team:"red",  kind:"crown", side:"left",  x:3.5,  y:5.5  },
  { team:"red",  kind:"crown", side:"right", x:14.5, y:5.5  },
  { team:"red",  kind:"king",  side:"mid",   x:9.0,  y:2.6  },
  { team:"blue", kind:"crown", side:"left",  x:3.5,  y:26.5 },
  { team:"blue", kind:"crown", side:"right", x:14.5, y:26.5 },
  { team:"blue", kind:"king",  side:"mid",   x:9.0,  y:29.4 },
];

const MATCH_TIME = 180, OVERTIME = 120;
const ELIXIR_MAX = 10, ELIXIR_PERIOD = 2.8;

const onBridge = x => BRIDGES.some(bx => Math.abs(x - bx) <= BRIDGE_HALF);
const inRiver  = (x,y) => y > RIVER.y0 && y < RIVER.y1 && !onBridge(x);

/* ============================================================
   3 · WELT
   ============================================================ */
let W = null;
let uid = 0;

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
const clamp = (v,lo,hi) => v<lo?lo:(v>hi?hi:v);
const dist  = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const avg   = a => a.reduce((s,v)=>s+v,0)/a.length;

function makeSide(deck){
  const s = shuffle(deck);
  return { elixir:5, hand:s.slice(0,4), queue:s.slice(4), crowns:0 };
}

function newWorld(diff){
  W = {
    units:[], towers:[], effects:[],
    blue:makeSide(DECK_BLUE), red:makeSide(DECK_RED),
    time:MATCH_TIME, phase:"regular", elixirRate:1/ELIXIR_PERIOD,
    over:false, result:null, reason:"",
    bot:{ timer:1.5, cfg:DIFFICULTY[diff], push:null },
    selected:-1, aim:null,
  };
  for(const spot of TOWER_SPOTS){
    const st = TOWER_STATS[spot.kind];
    const t = {
      id:++uid, team:spot.team, kind:spot.kind, side:spot.side,
      name:st.name, emoji:st.emoji,
      x:spot.x, y:spot.y, hp:st.hp, maxHp:st.hp,
      damage:st.damage, hitSpeed:st.hitSpeed, range:st.range, radius:st.radius,
      speed:0, layer:"ground", targets:"both",
      cd:0, target:null, dead:false, deploy:0, frozen:0,
      isTower:true, isBuilding:true,
      asleep:spot.kind === "king",
    };
    W.units.push(t); W.towers.push(t);
  }
  return W;
}

/** Setzt eine Karte aufs Feld. Gibt true zurück, wenn es geklappt hat. */
function playCard(team, handIndex, x, y){
  const side = W[team];
  const id = side.hand[handIndex];
  if(!id) return false;
  const card = CARDS[id];
  if(side.elixir < card.cost) return false;
  if(!canPlace(team, card, x, y)) return false;

  side.elixir -= card.cost;
  side.hand[handIndex] = side.queue.shift();
  side.queue.push(id);

  if(card.kind === "spell") castSpell(team, card, x, y);
  else spawnTroop(team, id, card, x, y);
  return true;
}

function canPlace(team, card, x, y){
  if(x < 0.6 || x > AW-0.6 || y < 0.6 || y > AH-0.6) return false;
  if(card.kind === "spell") return true;
  if(inRiver(x,y)) return false;

  const ownHalf = team === "blue" ? y > RIVER.y1 + 0.2 : y < RIVER.y0 - 0.2;
  if(ownHalf) return true;

  // Nach einem zerstörten gegnerischen Wachturm darf man auf dessen Seite vorrücken.
  const foe = team === "blue" ? "red" : "blue";
  const side = x < AW/2 ? "left" : "right";
  const fallen = W.towers.find(t => t.team===foe && t.kind==="crown" && t.side===side && t.dead);
  if(!fallen) return false;
  return team === "blue" ? y > 2 : y < AH - 2;
}

function spawnTroop(team, id, card, x, y){
  const n = card.count || 1;
  for(let i=0;i<n;i++){
    let ox = 0, oy = 0;
    if(n > 1){
      const a = (i / n) * Math.PI * 2;
      const r = 0.42 + (n > 3 ? 0.2 : 0);
      ox = Math.cos(a) * r; oy = Math.sin(a) * r;
    }
    W.units.push({
      id:++uid, team, cardId:id, name:card.name, emoji:card.emoji,
      x:clamp(x+ox, 0.5, AW-0.5), y:clamp(y+oy, 0.5, AH-0.5),
      hp:card.hp, maxHp:card.hp,
      damage:card.damage, hitSpeed:card.hitSpeed, range:card.range,
      speed:card.speed, radius:card.radius, layer:card.layer, targets:card.targets,
      splash:card.splash || 0, deathBlast:card.deathBlast || null,
      lifetime:card.lifetime || 0,
      cd:0, target:null, dead:false, deploy:1.0, frozen:0,
      isTower:false, isBuilding:card.kind === "building",
    });
  }
}

/* ============================================================
   4 · WEGFINDUNG
   Kein A* — Einheiten folgen einer Wegpunkt-Kette pro Lane:
   Brücke ansteuern, Fluss überqueren, dann zum nächsten Turm.
   Lufteinheiten überspringen die Kette und fliegen direkt.
   Zusätzlich drücken sich Einheiten sanft auseinander (Separation),
   damit sie sich nicht stapeln.
   ============================================================ */
function goalTower(u){
  let best = null, bd = 1e9;
  for(const t of W.towers){
    if(t.team === u.team || t.dead) continue;
    // Solange noch ein Wachturm steht, ist der Königsturm kein Laufziel.
    if(t.kind === "king" && W.towers.some(o => o.team===t.team && o.kind==="crown" && !o.dead)) continue;
    const d = dist(u,t);
    if(d < bd){ bd = d; best = t; }
  }
  return best;
}

/** Liegt der Fluss zwischen den beiden? Dann führt kein direkter Weg hin. */
function riverBetween(a, b){
  return (a.y <= RIVER.y0 && b.y >= RIVER.y1) || (a.y >= RIVER.y1 && b.y <= RIVER.y0);
}

/** Nächster Punkt auf der Brücken-Route: erst davor sammeln, dann hinüber. */
function bridgePoint(u){
  const bx = BRIDGES.reduce((a,b) => Math.abs(b-u.x) < Math.abs(a-u.x) ? b : a);
  const approachY = u.team === "blue" ? RIVER.y1 + 0.6 : RIVER.y0 - 0.6;
  const exitY     = u.team === "blue" ? RIVER.y0 - 0.9 : RIVER.y1 + 0.9;
  const before = u.team === "blue" ? u.y > approachY + 0.15 : u.y < approachY - 0.15;
  if(before && Math.abs(u.x - bx) > 0.3) return { x:bx, y:approachY };
  return { x:bx, y:exitY };
}

function waypoint(u){
  const goal = goalTower(u);
  if(!goal) return null;
  if(u.layer === "air") return goal;
  const crossed = u.team === "blue" ? u.y < RIVER.y0 : u.y > RIVER.y1;
  return crossed ? goal : bridgePoint(u);
}

/** Auf ein Ziel zulaufen — Bodeneinheiten nehmen dabei zwingend die Brücke. */
function advance(u, target, dt){
  if(u.layer === "ground" && riverBetween(u, target)){
    const p = bridgePoint(u);
    step(u, p.x, p.y, dt);
  } else {
    step(u, target.x, target.y, dt);
  }
}

function step(u, tx, ty, dt){
  const dx = tx - u.x, dy = ty - u.y;
  const d = Math.hypot(dx, dy);
  if(d < 1e-4) return;
  const mv = Math.min(u.speed * dt, d);
  let nx = u.x + dx/d*mv, ny = u.y + dy/d*mv;

  // Bodeneinheiten kommen nicht ins Wasser: notfalls seitlich zur Brücke schieben.
  if(u.layer === "ground" && inRiver(nx, ny)){
    const bx = BRIDGES.reduce((a,b) => Math.abs(b-u.x) < Math.abs(a-u.x) ? b : a);
    nx = u.x + Math.sign(bx - u.x) * Math.min(u.speed*dt, Math.abs(bx-u.x));
    ny = u.y;
    if(inRiver(nx, ny)){ nx = u.x; ny = u.y; }
  }
  u.x = clamp(nx, 0.4, AW-0.4);
  u.y = clamp(ny, 0.4, AH-0.4);
}

function separate(dt){
  const list = W.units;
  for(let i=0;i<list.length;i++){
    const a = list[i];
    if(a.dead || a.isTower || a.isBuilding || a.speed === 0) continue;
    for(let j=i+1;j<list.length;j++){
      const b = list[j];
      if(b.dead || b.layer !== a.layer) continue;
      const min = a.radius + b.radius;
      const dx = b.x-a.x, dy = b.y-a.y;
      const d2 = dx*dx + dy*dy;
      if(d2 >= min*min || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const push = (min - d) * 0.5;
      const ux = dx/d, uy = dy/d;
      const bStatic = b.isTower || b.isBuilding || b.speed === 0;
      if(bStatic){
        a.x = clamp(a.x - ux*push*2, 0.4, AW-0.4);
        a.y = clamp(a.y - uy*push*2, 0.4, AH-0.4);
      } else {
        a.x = clamp(a.x - ux*push, 0.4, AW-0.4);
        a.y = clamp(a.y - uy*push, 0.4, AH-0.4);
        b.x = clamp(b.x + ux*push, 0.4, AW-0.4);
        b.y = clamp(b.y + uy*push, 0.4, AH-0.4);
      }
    }
  }
}

/* ============================================================
   5 · ZIELE & KAMPF
   Jede Einheit sucht das NÄCHSTE gültige Ziel in ihrem Aggro-Radius.
   Gültig heißt: anderes Team, passende Ebene (Luft/Boden), und der
   targets-Filter der Karte erlaubt es. Findet sie nichts, läuft sie
   weiter zum Wegpunkt. Stirbt ihr Ziel, sucht sie sofort neu.
   ============================================================ */
function canHit(u, t){
  if(u.targets === "both") return true;
  if(u.targets === "buildings") return !!t.isBuilding;
  if(u.targets === "air") return t.layer === "air";
  return t.layer === "ground";
}

function aggroRadius(u){
  if(u.isTower) return u.range;
  return Math.max(u.range + 3.2, 4.2);
}

function findTarget(u){
  // "Nur Gebäude"-Einheiten ignorieren Truppen komplett und laufen quer über die Karte.
  if(u.targets === "buildings"){
    let best=null, bd=1e9;
    for(const t of W.units){
      if(t.dead || t.team === u.team || !t.isBuilding) continue;
      if(t.isTower && t.kind === "king" && W.towers.some(o=>o.team===t.team&&o.kind==="crown"&&!o.dead)) continue;
      const d = dist(u,t);
      if(d < bd){ bd = d; best = t; }
    }
    return best;
  }
  const R = aggroRadius(u);
  let best=null, bd=1e9;
  for(const t of W.units){
    if(t.dead || t.team === u.team || !canHit(u,t)) continue;
    if(t.isTower && t.asleep && !u.isTower){
      // Schlafender Königsturm zieht keine Aufmerksamkeit auf sich.
      if(W.towers.some(o=>o.team===t.team&&o.kind==="crown"&&!o.dead)) continue;
    }
    const d = dist(u,t) - t.radius;
    if(d <= R && d < bd){ bd = d; best = t; }
  }
  return best;
}

function damage(t, amount, source){
  if(t.dead) return;
  t.hp -= amount;
  if(t.isTower && t.kind === "king") t.asleep = false;
  if(t.hp <= 0){
    t.hp = 0; t.dead = true;
    if(t.deathBlast) areaDamage(t.team, t.x, t.y, t.deathBlast.radius, t.deathBlast.damage, 1, 0, 0, "#FFB35C");
    if(t.isTower) onTowerDown(t);
  }
}

function onTowerDown(t){
  const foe = t.team === "blue" ? "red" : "blue";
  W[foe].crowns++;
  W.effects.push({ kind:"ring", x:t.x, y:t.y, r:0, max:4.5, life:0.9, t:0.9, color:"#F0C14B" });
  if(t.kind === "crown"){
    const king = W.towers.find(o => o.team===t.team && o.kind==="king");
    if(king) king.asleep = false;
  }
  if(t.kind === "king"){
    finish(foe, foe === "blue" ? "Du hast den Königsturm zerstört." : "Dein Königsturm ist gefallen.");
  } else if(W.phase === "overtime"){
    finish(foe, "Verlängerung — der erste Turmfall entscheidet.");
  }
}

function combat(dt){
  for(const u of W.units){
    if(u.dead) continue;

    if(u.frozen > 0){ u.frozen -= dt; continue; }
    if(u.deploy > 0){ u.deploy -= dt; continue; }

    if(u.lifetime > 0){
      u.lifetime -= dt;
      if(u.lifetime <= 0){ u.dead = true; continue; }
    }
    if(u.isTower && u.asleep) continue;

    u.cd -= dt;

    if(!u.target || u.target.dead || (!u.isTower && !canHit(u,u.target))) u.target = findTarget(u);
    if(u.target && u.isTower && dist(u,u.target) - u.target.radius > u.range) u.target = findTarget(u);

    if(u.target){
      const reach = u.range + u.radius + u.target.radius;
      const d = dist(u, u.target);
      if(d <= reach){
        if(u.cd <= 0 && u.damage > 0){
          u.cd = u.hitSpeed;
          if(u.splash){
            areaDamage(u.team, u.target.x, u.target.y, u.splash, u.damage, 1, 0, 0, "#FF9A4C", u.targets);
          } else {
            damage(u.target, u.damage, u);
          }
          W.effects.push({ kind:"hit", x:u.target.x, y:u.target.y, life:0.16, t:0.16 });
        }
      } else if(u.speed > 0){
        advance(u, u.target, dt);
      }
      continue;
    }

    if(u.speed > 0){
      const wp = waypoint(u);
      if(wp) step(u, wp.x, wp.y, dt);
    }
  }
  W.units = W.units.filter(u => !u.dead || u.isTower);
}

/* ============================================================
   6 · ZAUBER
   Sofortwirkung im Radius. Türme nehmen bewusst nur 35 % —
   sonst wäre "Türme wegzaubern" eine Strategie ohne Truppen.
   ============================================================ */
const TOWER_SPELL_FACTOR = 0.35;

function areaDamage(team, x, y, radius, amount, towerFactor, freeze, knockback, color, filter){
  for(const t of W.units){
    if(t.dead || t.team === team) continue;
    if(filter === "buildings" && !t.isBuilding) continue;
    if(dist({x,y}, t) > radius + t.radius) continue;
    const f = t.isTower ? towerFactor : 1;
    if(amount > 0) damage(t, amount * f, null);
    if(freeze && !t.isTower) t.frozen = Math.max(t.frozen, freeze);
    if(knockback && !t.isTower && !t.isBuilding){
      const dx = t.x-x, dy = t.y-y, d = Math.hypot(dx,dy) || 1;
      t.x = clamp(t.x + dx/d*knockback, 0.4, AW-0.4);
      t.y = clamp(t.y + dy/d*knockback, 0.4, AH-0.4);
    }
  }
  W.effects.push({ kind:"ring", x, y, r:0, max:radius, life:0.45, t:0.45, color:color || "#FFD27A" });
}

function castSpell(team, card, x, y){
  areaDamage(team, x, y, card.radius, card.damage,
             TOWER_SPELL_FACTOR, card.freeze || 0, card.knockback || 0,
             card.freeze ? "#8FE3FF" : "#FFB35C");
}

/* ============================================================
   7 · GEGNER-KI
   Kein Lernen, keine Suche — eine Prioritätenliste:
   1. Steht etwas Bedrohliches in meiner Hälfte? Konter spielen.
   2. Sonst sparen, bis genug Elixier für einen Angriff da ist.
   Der Schwierigkeitsgrad regelt Reaktionszeit, Sparziel und wie oft
   die KI danebengreift.
   ============================================================ */
/** Grober Kampfwert einer Einheit: Lebenspunkte plus drei Sekunden Schaden. */
const power = e => e.hp + (e.damage / e.hitSpeed) * 3;

/**
 * Steht der Bedrohung schon genug eigene Verteidigung gegenüber?
 * Ohne diese Prüfung wirft eine schnell reagierende KI drei Karten auf
 * eine einzige Ratte und steht danach ohne Elixier da — schnellere
 * Reaktionszeit wäre dann paradoxerweise ein Nachteil.
 */
function underDefended(threats, team){
  team = team || "red";
  const cx = avg(threats.map(t => t.x));
  const cy = avg(threats.map(t => t.y));
  const need = threats.reduce((s,t) => s + power(t), 0);
  const have = W.units
    .filter(u => u.team === team && !u.dead && !u.isTower
              && u.targets !== "buildings"          // Belagerer verteidigen nicht mit
              && Math.hypot(u.x-cx, u.y-cy) < 7)    // nur, was wirklich in der Nähe steht
    .reduce((s,u) => s + power(u), 0);
  return have < need * 0.9;
}

/** Wählt einen Konter und setzt ihn. Gibt true zurück, wenn gespielt wurde. */
function tryDefend(threats, options, cfg){
  const anyAir = threats.some(t => t.layer === "air");
  const swarm  = threats.length >= 3;

  let pool = options.filter(o => o.c.targets !== "buildings");
  if(anyAir) pool = pool.filter(o => o.c.kind === "spell" || o.c.targets === "both" || o.c.targets === "air");
  if(!pool.length) return false;

  let best = null, bestScore = -1e9;
  for(const o of pool){
    const c = o.c;
    let s;
    if(c.kind === "spell"){
      s = swarm ? 70 : 12;
      if(c.freeze) s -= 25;
    } else {
      const n = c.count || 1;
      s = (c.damage / c.hitSpeed) * n / 9 + (c.hp * n) / 380;
      if(c.splash && swarm) s *= 1.7;
    }
    s -= c.cost * 3;
    s += Math.random() * cfg.sloppiness * 40;
    if(s > bestScore){ bestScore = s; best = o; }
  }
  if(!best || bestScore <= 0) return false;

  const cx = avg(threats.map(t => t.x));
  const cy = avg(threats.map(t => t.y));
  const jx = (Math.random()-0.5) * 2 * cfg.aim;
  const jy = (Math.random()-0.5) * 2 * cfg.aim;
  let px = cx + jx, py = cy + jy;
  if(best.c.kind !== "spell") py = clamp(py - 2.4, 2, RIVER.y0 - 0.8);
  return playCard("red", best.i, clamp(px, 1, AW-1), py);
}

function botThink(dt){
  const b = W.bot, side = W.red, cfg = b.cfg;
  b.timer -= dt;
  if(b.timer > 0) return;
  b.timer = cfg.interval;

  const options = side.hand
    .map((id,i) => ({ id, i, c:CARDS[id] }))
    .filter(o => o.c.cost <= side.elixir);
  if(!options.length) return;

  const threats = W.units.filter(u =>
    u.team === "blue" && !u.dead && !u.isTower && !u.isBuilding && u.y < RIVER.y1 + 1.5);

  const threatValue = threats.reduce((s2,t) => s2 + power(t), 0);
  if(threats.length && threatValue >= cfg.patience && underDefended(threats)){
    if(Math.random() < cfg.skip) return;      // schwächere Stufen verschlafen Angriffe
    if(tryDefend(threats, options, cfg)) return;
  }

  // Nachschub: hinter einen laufenden Angriff sofort Unterstützung setzen.
  if(b.push){
    b.push.t -= cfg.interval;
    if(b.push.t <= 0) b.push = null;
    else if(Math.random() < cfg.combo){
      // Nachschub nur, wenn danach noch Elixier zum Verteidigen bleibt.
      // Ohne diese Reserve verpulvert eine angriffsfreudige KI alles nach
      // vorn und steht beim Gegenangriff mit leeren Händen da.
      const support = options.filter(o =>
        o.c.kind === "troop" && o.c.targets !== "buildings" && o.c.range >= 2.5
        && side.elixir - o.c.cost >= 3);
      if(support.length){
        support.sort((a,b2) =>
          (b2.c.damage/b2.c.hitSpeed*(b2.c.count||1)) - (a.c.damage/a.c.hitSpeed*(a.c.count||1)));
        if(playCard("red", support[0].i, b.push.lane, 2.5)){ b.push = null; return; }
      }
    }
  }

  // Angriff: erst sparen, dann eine Lane bespielen.
  if(side.elixir < cfg.savings) return;
  const troops = options.filter(o => o.c.kind === "troop");
  if(!troops.length) return;
  troops.sort((a,b2) => (b2.c.hp * (b2.c.count||1)) - (a.c.hp * (a.c.count||1)));
  const pick = Math.random() < cfg.sloppiness
    ? troops[(Math.random()*troops.length)|0]
    : troops[0];
  const lane = BRIDGES[Math.random() < 0.5 ? 0 : 1];
  if(playCard("red", pick.i, lane, 4.0)) b.push = { lane, t:4.0 };
}

/* ============================================================
   8 · SPIELSCHLEIFE
   Feste Simulationsschritte (1/60 s) über einen Akkumulator:
   Die Simulation bleibt gleich, egal wie schnell der Bildschirm ist.
   ============================================================ */
const FIXED = 1/60;
let acc = 0, last = 0, running = false;

function tick(dt){
  if(W.over) return;

  W.blue.elixir = Math.min(ELIXIR_MAX, W.blue.elixir + W.elixirRate * dt);
  W.red.elixir  = Math.min(ELIXIR_MAX, W.red.elixir  + W.elixirRate * dt);

  botThink(dt);
  combat(dt);
  separate(dt);

  for(const e of W.effects){ e.t -= dt; if(e.kind === "ring") e.r = e.max * (1 - e.t/e.life); }
  W.effects = W.effects.filter(e => e.t > 0);

  W.time -= dt;
  if(W.time <= 0){
    if(W.phase === "regular"){
      if(W.blue.crowns !== W.red.crowns){
        const win = W.blue.crowns > W.red.crowns ? "blue" : "red";
        finish(win, "Nach drei Minuten entscheidet die Turmzahl.");
      } else {
        W.phase = "overtime";
        W.time = OVERTIME;
        W.elixirRate = 2/ELIXIR_PERIOD;
      }
    } else {
      finish(null, "Keiner konnte in der Verlängerung einen Turm brechen.");
    }
  }
}

function finish(winner, reason){
  if(W.over) return;
  W.over = true; W.result = winner; W.reason = reason;
  showEnd();
}

function frame(now){
  if(!running) return;
  if(!last) last = now;
  let dt = (now - last)/1000;
  last = now;
  if(dt > 0.25) dt = 0.25;          // nach Tab-Wechsel nicht aufholen
  acc += dt;
  while(acc >= FIXED){ tick(FIXED); acc -= FIXED; }
  draw(dt);
  syncHud();
  requestAnimationFrame(frame);
}

/* ============================================================
   9 · DARSTELLUNG
   Die 3D-Szene liegt in render3d.js, die Figuren in models.js.
   Hier bleibt nur die Verbindung: das Canvas-Element selbst.
   Die Spiellogik oben weiß von 3D nichts — sie rechnet weiter
   in Kacheln, der Renderer liest den Zustand nur ab.
   ============================================================ */
const cv = document.getElementById("cv");

/* ============================================================
   10 · BEDIENUNG
   ============================================================ */
const handEl   = document.getElementById("hand");
const fillEl   = document.getElementById("elixirFill");
const numEl    = document.getElementById("elixirNum");
const timeEl   = document.getElementById("time");
const phaseEl  = document.getElementById("phase");
const crBlueEl = document.getElementById("crBlue");
const crRedEl  = document.getElementById("crRed");
const hintEl   = document.getElementById("hint");

const ticks = document.getElementById("elixirTicks");
for(let i=0;i<ELIXIR_MAX;i++) ticks.appendChild(document.createElement("i"));

let cardBtns = [], nextBtn = null;

function buildHand(){
  handEl.innerHTML = "";
  nextBtn = document.createElement("div");
  nextBtn.className = "card next";
  nextBtn.innerHTML = `<div class="ico"></div><div class="lbl">Nächste</div>`;
  handEl.appendChild(nextBtn);

  cardBtns = [];
  for(let i=0;i<4;i++){
    const b = document.createElement("button");
    b.className = "card";
    b.type = "button";
    b.innerHTML = `<div class="cost"></div><div class="ico"></div><div class="nm"></div>`;
    b.addEventListener("click", () => selectCard(i));
    handEl.appendChild(b);
    cardBtns.push(b);
  }
}

/* Zeichnet eine Karte in ihren Platz. Karten mit eigenem Bild bekommen
   die Klasse "has-art" — dann liefert das Bild Rahmen und Titel selbst
   und das Titelschild aus CSS wird ausgeblendet. Laedt das Bild nicht,
   faellt die Karte auf Emoji plus CSS-Rahmen zurueck. */
function paintCard(btn, c){
  const ico = btn.querySelector(".ico");
  const nm = btn.querySelector(".nm");
  if(nm) nm.textContent = c.name;
  btn.title = c.name;
  ico.innerHTML = "";
  if(c.card){
    const im = new Image();
    im.alt = c.name;
    im.draggable = false;
    im.onerror = () => { btn.classList.remove("has-art"); ico.textContent = c.emoji; };
    im.src = c.card;
    ico.appendChild(im);
    btn.classList.add("has-art");
  } else {
    btn.classList.remove("has-art");
    ico.textContent = c.emoji;
  }
}

function selectCard(i){
  W.selected = W.selected === i ? -1 : i;
  W.aim = null;
  const card = CARDS[W.blue.hand[i]];
  if(W.selected >= 0 && card){
    hintEl.hidden = false;
    hintEl.textContent = card.kind === "spell"
      ? `${card.name} — beliebige Stelle antippen`
      : `${card.name} — auf deiner Hälfte platzieren`;
  } else {
    hintEl.hidden = true;
  }
  syncHud();
}

function syncHud(){
  const e = W.blue.elixir;
  fillEl.style.width = (e/ELIXIR_MAX*100) + "%";
  numEl.textContent = Math.floor(e);

  for(let i=0;i<4;i++){
    const b = cardBtns[i], id = W.blue.hand[i], c = CARDS[id];
    if(!c) continue;
    if(b.dataset.id !== id){
      b.dataset.id = id;
      paintCard(b, c);
      b.querySelector(".cost").textContent = c.cost;
      b.setAttribute("aria-label", `${c.name}, ${c.cost} Elixier`);
    }
    b.disabled = e < c.cost || W.over;
    b.classList.toggle("sel", W.selected === i);
  }
  const nxId = W.blue.queue[0], nx = CARDS[nxId];
  if(nx && nextBtn.dataset.id !== nxId){
    nextBtn.dataset.id = nxId;
    paintCard(nextBtn, nx);
  }

  const t = Math.max(0, Math.ceil(W.time));
  timeEl.textContent = Math.floor(t/60) + ":" + String(t%60).padStart(2,"0");
  phaseEl.textContent = W.phase === "overtime" ? "Verlängerung · doppeltes Elixier" : "Reguläre Zeit";
  phaseEl.classList.toggle("hot", W.phase === "overtime");
  crBlueEl.textContent = W.blue.crowns;
  crRedEl.textContent  = W.red.crowns;
}

/** Zeigerposition auf die Bodenebene der 3D-Szene projizieren. */
function toTile(ev){
  const p = ev.touches ? ev.touches[0] : ev;
  return pickTile(p.clientX, p.clientY);
}

cv.addEventListener("pointermove", ev => {
  if(W.selected < 0 || W.over) return;
  W.aim = toTile(ev);          // null, wenn der Strahl den Boden verfehlt
});
cv.addEventListener("pointerleave", () => { W.aim = null; });
cv.addEventListener("pointerdown", ev => {
  if(W.over || W.selected < 0) return;
  ev.preventDefault();
  const p = toTile(ev);
  if(!p) return;
  W.aim = p;
  if(playCard("blue", W.selected, p.x, p.y)){
    W.selected = -1; W.aim = null; hintEl.hidden = true;
    syncHud();
  }
});

document.addEventListener("keydown", ev => {
  if(ev.key >= "1" && ev.key <= "4") selectCard(+ev.key - 1);
  if(ev.key === "Escape"){ W.selected = -1; W.aim = null; hintEl.hidden = true; syncHud(); }
});

/* ---------- Overlays ---------- */
const startVeil = document.getElementById("startVeil");
const endVeil   = document.getElementById("endVeil");
let difficulty = 1;

document.getElementById("diffPick").addEventListener("click", ev => {
  const b = ev.target.closest("button[data-d]");
  if(!b) return;
  difficulty = +b.dataset.d;
  for(const x of ev.currentTarget.querySelectorAll("button")) x.classList.toggle("on", x === b);
});

function showEnd(){
  const won = W.result === "blue";
  document.getElementById("endTitle").textContent =
    W.result === null ? "Unentschieden" : (won ? "Sieg" : "Niederlage");
  document.getElementById("endTitle").style.color =
    W.result === null ? "var(--gold)" : (won ? "var(--blue)" : "var(--red)");
  document.getElementById("endTally").textContent = `${W.blue.crowns} : ${W.red.crowns} Türme`;
  document.getElementById("endWhy").textContent = W.reason;
  endVeil.hidden = false;
}

function start(){
  initScene(cv);
  newWorld(difficulty);
  resetScene();
  buildHand();
  resize();
  syncHud();
  startVeil.hidden = true;
  endVeil.hidden = true;
  hintEl.hidden = true;
  acc = 0; last = 0;
  if(!running){ running = true; requestAnimationFrame(frame); }
}

document.getElementById("startBtn").addEventListener("click", start);
document.getElementById("againBtn").addEventListener("click", start);

/* Startbild vorbereiten, damit die Arena schon zu sehen ist. */
initScene(cv);
newWorld(difficulty);
buildHand();
new ResizeObserver(resize).observe(cv);
window.addEventListener("resize", resize);
requestAnimationFrame(() => { resize(); draw(0.016); syncHud(); });
</script>

</body>
